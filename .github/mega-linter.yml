# MegaLinter main configuration of the analyze template. MegaLinter only
# auto-discovers its main config in the repository root, so analyze.yml loads it
# from here through MEGALINTER_CONFIG. The per-linter configs are in
# .github/linters, where MegaLinter finds them by their default names.
# Every entry is preceded by why it is needed.
# All options: https://megalinter.io/latest/configuration/

DISABLE_LINTERS:
  # Why: YAML_PRETTIER only checks formatting. On the files of the other
  # templates it reports mixed quoting (single and double quotes), a blank line
  # after `jobs:` and trailing whitespace. A .prettierrc.json cannot make them
  # pass: with `singleQuote: true` the double-quoted values in autobackport.yml
  # and recompile_agentic_workflows.yml are still reported. yamllint covers the
  # structural checks of YAML files.
  - YAML_PRETTIER

# Why: *.lock.yml files under .github/workflows are generated by `gh aw compile`
# (see recompile_agentic_workflows.yml) from the sibling .md files, so they are
# not hand-written. Without this filter yamllint reports lines of up to 6540
# characters (limit 500), actionlint reports the unexpected `queue` key of
# `concurrency`, and cspell reports unknown words.
FILTER_REGEX_EXCLUDE: "\\.lock\\.yml$"

# Why: the v8r finding is carried over from plengauer/Thoth#4155 and was not
# reproduced here: v8r resolves the bare `on:` key of a workflow to a YAML 1.1
# boolean before validating it against the GitHub workflow schema, which GitHub
# itself does not care about. Every workflow of the templates uses a bare `on:`.
# actionlint and zizmor keep validating the workflows.
YAML_V8R_FILTER_REGEX_EXCLUDE: "\\.github/workflows/"

# Why: autotriage.md is the source of an agentic workflow, so its body is the
# prompt of an AI agent, one long line per instruction, and not documentation.
# markdownlint (MD013, 400 characters) and rumdl (MD013, 80 characters) report
# its long lines.
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: "\\.github/workflows/[^/]*\\.md$"
MARKDOWN_RUMDL_FILTER_REGEX_EXCLUDE: "\\.github/workflows/[^/]*\\.md$"

# Why: MegaLinter replaces the value of GITHUB_TOKEN with HIDDEN_BY_MEGALINTER
# for the linters unless it is listed here. zizmor then aborts with "no audit
# was performed" and a 401 Unauthorized from GitHub (reproduced with that value).
# analyze.yml provides the token.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
